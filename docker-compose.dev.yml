services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - telegram_sessions:/var/www/html/telegram_sessions
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      HANDLER_PHP_BINARY: /usr/local/bin/php

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-watcher}
      POSTGRES_USER: ${DB_USERNAME:-watcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-watcher} -d ${DB_DATABASE:-watcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  vendor:
  node_modules:
  telegram_sessions:
