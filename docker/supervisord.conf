[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:www-data

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telegram-handler]
command=php /var/www/html/artisan telegram:handle
directory=/var/www/html
autostart=false
autorestart=false
user=www-data
stdout_logfile=/var/www/html/storage/logs/telegram.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/telegram.log
stderr_logfile_maxbytes=0
